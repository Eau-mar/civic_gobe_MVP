databases:
  - name: civic_niger_db
    databaseName: civic_niger
    user: civic_user
    plan: free

services:
  - type: web
    name: civic-niger-api
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn civic_niger.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: civic_niger_db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
