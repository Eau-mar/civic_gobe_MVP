{% extends "civicTech/base.html" %}

{% block titre %}Modifier mon profil{% endblock titre %}

{% block content %}
<div class="max-w-xl mx-auto py-10 px-4 sm:px-6 lg:px-8">
  <h2 class="text-3xl font-bold text-[#007f5f] mb-6">✏️ Modifier mes informations</h2>

  <form method="POST" enctype="multipart/form-data" class="space-y-6 bg-white shadow-md rounded-md p-6 border">
    {% csrf_token %}
    {% for field in form %}
      <div>
        <label class="block font-medium text-gray-700 mb-1">{{ field.label }}</label>
        {{ field }}
        {% if field.errors %}
          <p class="text-sm text-red-600">{{ field.errors.0 }}</p>
        {% endif %}
      </div>
    {% endfor %}

    <button type="submit" class="bg-[#e76f00] hover:bg-orange-600 text-white font-semibold px-6 py-2 rounded-md">
      💾 Enregistrer les modifications
    </button>
  </form>
</div>
{% endblock %}
